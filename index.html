<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0c0d0f" />
    <title>Draw my code</title>
    <meta name="description"
      content="A daily puzzle: read a tiny C function, paint its output on an 8×8 grid." />
    <!-- Link previews need absolute URLs: the build fills in the site's (vite.config.ts). -->
    <link rel="canonical" href="%SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Draw my code" />
    <meta property="og:title" content="Draw my code" />
    <meta property="og:description"
      content="A daily puzzle: read a tiny C function, paint its output on an 8×8 grid." />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"
      content="Draw my code: int f(int x, int y), and a red disc painted on an 8×8 grid" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/src/fonts/jetbrains-mono.woff2" as="font" type="font/woff2"
      crossorigin />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Without an icon link, browsers request /favicon.ico at the domain root and log a 404. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <!-- iOS ignores maskable manifest icons, and prefers this one for the home screen. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
