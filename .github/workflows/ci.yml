name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily, off the hour. Scheduled runs only run `check`.
    - cron: "17 6 * * *"

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Pinned: ubuntu-26.04 has gcc 15, like local machines; ubuntu-latest still has gcc 13.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7
          cache: true
      - run: deno install --frozen
      - run: deno task check
