name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Pinned: ubuntu-26.04 has gcc 15, like local machines; ubuntu-latest still has gcc 13.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7
          cache: true
      - run: deno install --frozen
      - run: deno task check
      # Open puzzles are frozen against what players have now: the deployed commit's schedule
      # (the push's previous head, or the pull request's base), not just the committed file.
      # [allow-published-edit] in a pushed commit's message, or in a pull request's title, lifts
      # the freeze, as the flag does locally.
      - id: deployed
        env:
          SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          MESSAGES: ${{ join(github.event.commits.*.message, ' ') }} ${{ github.event.pull_request.title }}
        run: |
          case "$MESSAGES" in
            *"[allow-published-edit]"*)
              echo "options=--allow-published-edit" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          # A new branch has no previous head. Otherwise a failed fetch fails the check.
          if [ -z "$SHA" ] || [ "$SHA" = "0000000000000000000000000000000000000000" ]; then exit 0; fi
          git fetch --quiet --depth=1 origin "$SHA"
          git show "$SHA:src/levels/generated.ts" > "$RUNNER_TEMP/deployed-generated.ts"
          echo "options=--base=$RUNNER_TEMP/deployed-generated.ts" >> "$GITHUB_OUTPUT"
      - run: deno task levels:check ${{ steps.deployed.outputs.options }}

  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: read
    outputs:
      site-url: ${{ steps.site.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7
          cache: true
      - run: deno install --frozen
      # The base path and site URL come from the Pages configuration: a custom domain needs no
      # code change.
      - id: pages
        uses: actions/configure-pages@v6
      - id: site
        run: echo "url=${BASE_URL%/}/" >> "$GITHUB_OUTPUT"
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
      - run: deno task build
        env:
          VITE_SITE_URL: ${{ steps.site.outputs.url }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7
          cache: true
      - run: deno install --frozen
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      # Browsers are installed fresh: Playwright advises against caching them, since their system
      # dependencies must be installed anyway. The full Chromium, not the headless shell.
      - run: npx playwright install --with-deps --no-shell chromium webkit
        working-directory: e2e
      # The exact files that deploy will publish.
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - run: mkdir -p dist && tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C dist
      # The itch.io build isn't deployed: it is built here for its own spec.
      - run: deno task build:itch
      - run: deno task e2e:run
        env:
          VITE_SITE_URL: ${{ needs.build.outputs.site-url }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time, and never cancel one halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
